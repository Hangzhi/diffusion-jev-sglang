[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffusion-jev-sglang"
version = "0.1.0"
description = "Local typed decisions from LLaDA diffusion logits, served with SGLang"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "typer>=0.15,<1", "numpy>=2,<3", "transformers>=4.57,<6", "pyyaml>=6,<7", "jinja2>=3.1.6,<4"]

[project.optional-dependencies]
engine = ["sglang==0.5.12.post1", "flash-attn-4==4.0.0b9"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
diffusion-jev = "diffusion_jev.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_jev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
